spring.application.name=TaskTrackingSystem
server.port=8080
server.servlet.context-path=/api

# Profiles
spring.profiles.active=dev

#JWT
jwt.secret=${JWT_SECRET:myVerySecretKeyForJWTTokenGenerationThatIsAtLeast256BitsLong2024!}
jwt.expiration=${JWT_EXPIRATION:86400000}

#File Upload Configuration
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
file.upload-dir=${FILE_UPLOAD_DIR:uploads}
#CORS
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:8080}


#File upload
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

#Logging
logging.level.com.airtribe=DEBUG
logging.level.org.springframework.security=INFO
logging.level.org.springframework.messaging=DEBUG
logging.level.org.springframework.web.socket=DEBUG

#Database handling
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=0
spring.jpa.hibernate.ddl-auto=update

spring.flyway.enabled=false



















